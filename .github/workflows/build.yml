name: Build

on:
  workflow_dispatch:

  push:
    branches:
      - master
    tags:
      - "v*"

jobs:
  build:
    name: Build Switch
    runs-on: ubuntu-latest

    container: devkitpro/devkita64:20210726

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build
        run: |
          make -j2
          make dist

      - name: List output
        run: |
          ls -lah
          ls -lah out || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sys-gdbstub
          path: gdbstub.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sys-gdbstub.zip
